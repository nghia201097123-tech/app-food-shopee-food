<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Shopee Food Extractor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 420px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
    }
    .header {
      text-align: center;
      padding-bottom: 15px;
      border-bottom: 1px solid #ddd;
      margin-bottom: 15px;
    }
    .header h1 {
      font-size: 16px;
      color: #ee4d2d;
    }
    .header p {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 5px;
      color: #333;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      outline: none;
      border-color: #ee4d2d;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 50px;
    }
    .form-row {
      display: flex;
      gap: 10px;
    }
    .form-row .form-group {
      flex: 1;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 5px;
    }
    .btn-primary {
      background: #ee4d2d;
      color: white;
    }
    .btn-primary:hover {
      background: #d73211;
    }
    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #fff;
      color: #333;
      border: 1px solid #ddd;
    }
    .btn-secondary:hover {
      background: #f5f5f5;
    }
    .btn-success {
      background: #28a745;
      color: white;
    }
    .btn-success:hover {
      background: #218838;
    }
    .status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
    }
    .status.show {
      display: block;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
    .status.info {
      background: #d1ecf1;
      color: #0c5460;
    }
    .result {
      margin-top: 10px;
      padding: 10px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      max-height: 180px;
      overflow-y: auto;
      font-size: 11px;
      display: none;
    }
    .result.show {
      display: block;
    }
    .result pre {
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .settings {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #ddd;
    }
    .settings h3 {
      font-size: 12px;
      margin-bottom: 10px;
      color: #666;
    }
    .section {
      background: #fff;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      border: 1px solid #e0e0e0;
    }
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #ee4d2d;
      margin-bottom: 10px;
    }
    .auto-sync {
      margin-top: 10px;
      padding: 10px;
      background: #fff3cd;
      border-radius: 4px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    .btn-row .btn {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Shopee Food Extractor</h1>
    <p>Gọi API Shopee Partner trực tiếp</p>
  </div>

  <!-- API Config Section -->
  <div class="section">
    <div class="section-title">Cấu hình API</div>

    <div class="form-group">
      <label>User ID</label>
      <input type="text" id="userId" placeholder="VD: customer_001">
    </div>

    <div class="form-group">
      <label>Access Token (x-foody-access-token)</label>
      <textarea id="accessToken" placeholder="B:Ef+J0H8KbTDJkqSVc5FTXfKI2EHy..."></textarea>
    </div>

    <div class="form-group">
      <label>Entity ID (x-foody-entity-id) - ID cửa hàng</label>
      <input type="text" id="entityId" placeholder="VD: 10382519">
    </div>

    <div class="form-group">
      <label>User-Agent</label>
      <input type="text" id="userAgent" placeholder="language=vi app_type=29" value="language=vi app_type=2">
    </div>
  </div>

  <!-- Security Headers Section -->
  <div class="section">
    <div class="section-title">Security Headers (Optional)</div>

    <div class="form-group">
      <label>x-sf-trace-id</label>
      <input type="text" id="xSfTraceId" placeholder="5e43998fc578423e86e0589dd8ded0e7">
    </div>

    <div class="form-group">
      <label>x-sf-request-id</label>
      <input type="text" id="xSfRequestId" placeholder="327bd0a4f3014184908155af4829a340">
    </div>

    <div class="form-group">
      <label>x-sap-ri</label>
      <input type="text" id="xSapRi" placeholder="00b950698e52225c3e0c4a27...">
    </div>

    <div class="form-group">
      <label>spc-b-oft</label>
      <textarea id="spcBOft" placeholder="eyJkYXRhIjoiS1QzUURx..." style="min-height: 40px;"></textarea>
    </div>

    <div class="form-group">
      <label>Signature Headers (d099a60f, 6f866b98, f5765e23, 201719c1)</label>
      <textarea id="signatureHeaders" placeholder="d099a60f: NI7TbNXpGHB3ncf0xKRY2k9SNfk=
6f866b98: lqzY/ug6CAG9danI9Bt4yzXz5Ok=
f5765e23: hXm7hEo2mRIbgbYt...
201719c1: uK77NxDowj2j179HaDm0s/XM3Pt=" style="min-height: 80px;"></textarea>
    </div>
  </div>

  <!-- Actions -->
  <div class="btn-row">
    <button class="btn btn-secondary" id="fetchStoresBtn">
      Lấy Store List
    </button>
    <button class="btn btn-primary" id="fetchOrdersBtn">
      Lấy Orders
    </button>
  </div>

  <button class="btn btn-success" id="sendBtn" style="margin-top: 8px;">
    Gửi lên Server
  </button>

  <!-- Auto Sync -->
  <div class="auto-sync">
    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
      <input type="checkbox" id="autoSync" style="width: 18px; height: 18px;">
      <span style="font-size: 13px; font-weight: 600;">Tự động lấy Orders mỗi 10 giây</span>
    </label>
    <div id="syncStatus" style="font-size: 11px; color: #666; margin-top: 5px; display: none;"></div>
  </div>

  <div class="status" id="status"></div>

  <div class="result" id="result">
    <pre id="resultData"></pre>
  </div>

  <div class="settings">
    <h3>Cài đặt Server</h3>
    <div class="form-group">
      <label>Server URL</label>
      <input type="text" id="serverUrl" placeholder="http://localhost:3000" value="http://localhost:3000">
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
